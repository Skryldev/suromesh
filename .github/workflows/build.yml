name: Cross-platform Go build

# Cross-platform Go build + full engineering gate (Phase 21 §17).
# Live Soroush Plus tests NEVER run here: they are credential-gated and
# remain a separate, explicit operator operation (docs/ci-cd.md).
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  # رنگ خروجی لاگ‌ها را فعال می‌کند تا خواندنشان راحت‌تر باشد
  GOTOOLCHAIN: local

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # برای diff دقیق‌تر و جلوگیری از مشکلات shallow clone

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Go environment (debug)
        run: |
          echo "::group::Go environment"
          go version
          go env GOOS GOARCH GOMOD GOWORK GOPATH GOCACHE GOMODCACHE
          echo "::endgroup::"
        shell: bash

      - name: Repository state (debug)
        run: |
          echo "::group::Git state"
          git rev-parse HEAD
          git status --porcelain
          echo "--- tracked go files ---"
          git ls-files '*.go' | head -50
          echo "--- presence of go.mod / go.sum ---"
          ls -la go.mod 2>&1 || true
          ls -la go.sum 2>&1 || true
          echo "::endgroup::"
        shell: bash

      - name: Module verification
        shell: bash
        run: |
          set -euo pipefail

          # 1) اطمینان از وجود go.sum (حتی اگر خالی) تا git diff روی مسیر ناموجود خطا ندهد
          if [ ! -f go.sum ]; then
            echo "::warning::go.sum missing in repo; creating an empty placeholder for tidy check"
            : > go.sum
          fi

          # 2) اجرای tidy
          go mod tidy

          # 3) نمایش diff برای دیباگ قبل از شکست
          echo "::group::git diff after go mod tidy"
          git --no-pager diff -- go.mod go.sum || true
          echo "::endgroup::"

          # 4) بررسی tidy بودن با محافظت در برابر مسیر ناموجود
          if ! git diff --quiet -- go.mod; then
            echo "::error::go.mod is not tidy"
            git --no-pager diff -- go.mod
            exit 1
          fi

          if git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            if ! git diff --quiet -- go.sum; then
              echo "::error::go.sum is not tidy"
              git --no-pager diff -- go.sum
              exit 1
            fi
          else
            echo "::warning::go.sum is not tracked by git; skipping tidy diff for it"
          fi

          # 5) verify
          go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail

          # فقط فایل‌های تحت کنترل گیت را بررسی می‌کنیم تا فایل‌های تولیدشده/کش‌شده باعث false positive نشوند
          mapfile -t GOFILES < <(git ls-files '*.go')
          if [ "${#GOFILES[@]}" -eq 0 ]; then
            echo "::warning::No Go files tracked by git; skipping gofmt check"
            exit 0
          fi

          echo "::group::gofmt -l output"
          OUT="$(gofmt -l "${GOFILES[@]}")"
          echo "${OUT:-<clean>}"
          echo "::endgroup::"

          if [ -n "${OUT}" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "${OUT}"
            echo "Run locally: gofmt -w ."
            exit 1
          fi

      - name: Tests
        run: go test -count=1 ./...

      - name: Race
        run: go test -race -count=1 ./...

      - name: Fuzz seed corpora
        run: go test -count=1 -run Fuzz ./...

      - name: Generator verification
        run: go run ./cmd/tlgen -verify

  cross-build:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Vet (cross)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

      - name: Build example binaries (all packages compile for target)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/suromesh-example-updates${{ matrix.ext }}" ./examples/updates
          go build -trimpath -ldflags "-s -w" \
            -o "dist/suromesh-example-media${{ matrix.ext }}" ./examples/media

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suromesh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14