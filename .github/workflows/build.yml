name: Cross-platform Go build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # پیش‌فرض: cgo خاموش است تا cross-compile و باینری‌های static کار کنند.
  # فقط در stepهایی که به cgo نیاز دارند (مثل race detector) به 1 override می‌شود.
  CGO_ENABLED: "0"

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      # ---------------------------------------------------------------
      # نصب mingw روی Windows برای فعال‌سازی cgo و race detector.
      # روی Linux و macOS کامپایلر C به‌طور پیش‌فرض موجود است.
      # ---------------------------------------------------------------
      - name: Install mingw (Windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          choco install mingw -y --no-progress
          MINGW_BIN="/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin"
          if [ -d "${MINGW_BIN}" ]; then
            echo "${MINGW_BIN}" >> "${GITHUB_PATH}"
          fi
          # افزودن مسیر جایگزین در صورت تفاوت نسخه chocolatey
          for d in /c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin \
                   /c/tools/mingw64/bin \
                   /c/mingw64/bin; do
            if [ -d "$d" ]; then
              echo "$d" >> "${GITHUB_PATH}"
            fi
          done

      - name: Go environment (debug)
        shell: bash
        run: |
          echo "::group::Go environment"
          go version
          go env GOOS GOARCH GOMOD GOFLAGS CGO_ENABLED CC
          echo "::endgroup::"

      - name: Module verification
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f go.sum ]; then
            echo "::warning::go.sum missing; creating placeholder"
            : > go.sum
          fi

          go mod tidy

          echo "::group::git diff after go mod tidy"
          git --no-pager diff -- go.mod go.sum || true
          echo "::endgroup::"

          if ! git diff --quiet -- go.mod; then
            echo "::error::go.mod is not tidy"
            git --no-pager diff -- go.mod
            exit 1
          fi

          if git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            if ! git diff --quiet -- go.sum; then
              echo "::error::go.sum is not tidy"
              git --no-pager diff -- go.sum
              exit 1
            fi
          fi

          go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # ---------------------------------------------------------------
      # Formatting: فقط روی Linux اجرا می‌شود.
      # دلیل: gofmt بین سیستم‌عامل‌ها به دلیل CRLF/LF و نسخه‌های مختلف
      # ممکن است false positive بدهد. فرمت کد یک بررسی platform-agnostic
      # است و کافیست روی یک OS اجرا شود.
      # ---------------------------------------------------------------
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail

          OUT="$(
            git ls-files -z '*.go' \
              | xargs -0 -r gofmt -l
          )"

          if [ -n "${OUT}" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "${OUT}"
            echo "Run locally: gofmt -w ."
            exit 1
          fi

          echo "All Go files are gofmt-clean ✅"

      # ---------------------------------------------------------------
      # Formatting cross-check روی macOS/Windows: فقط advisory.
      # ---------------------------------------------------------------
      - name: Formatting (advisory, non-blocking)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        continue-on-error: true
        run: |
          echo "::group::gofmt advisory output on ${{ matrix.os }}"
          git ls-files -z '*.go' | xargs -0 -r gofmt -l || true
          echo "::endgroup::"

      - name: Tests
        run: go test -count=1 ./...

      # ---------------------------------------------------------------
      # Race detector: نیاز به cgo دارد (CGO_ENABLED=1).
      # - روی Linux و macOS کامپایلر C پیش‌فرض موجود است.
      # - روی Windows با step «Install mingw» نصب شده است.
      # - timeout افزایش یافته چون race detector 2x-20x کندتر است.
      # اگر CI کند شد، می‌توانید شرط را به Linux محدود کنید:
      #   if: matrix.os == 'ubuntu-latest'
      # ---------------------------------------------------------------
      - name: Race
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 20m ./...

      - name: Fuzz seed corpora
        run: go test -count=1 -run Fuzz ./...

      - name: Generator verification
        run: go run ./cmd/tlgen -verify

  cross-build:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux,   goarch: amd64, ext: ""   }
          - { goos: linux,   goarch: arm64, ext: ""   }
          - { goos: darwin,  goarch: amd64, ext: ""   }
          - { goos: darwin,  goarch: arm64, ext: ""   }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Vet (cross)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

      - name: Build example binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/suromesh-example-updates${{ matrix.ext }}" ./examples/updates
          go build -trimpath -ldflags "-s -w" \
            -o "dist/suromesh-example-media${{ matrix.ext }}" ./examples/media

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suromesh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14