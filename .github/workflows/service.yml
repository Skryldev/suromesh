name: service

# SuroMesh Service module validation (Phase 25) — independent of the SDK
# workflows. Live tests do not exist yet and must never run here.
on:
  push:
    paths: ["service/**", ".github/workflows/service.yml"]
  pull_request:
    paths: ["service/**", ".github/workflows/service.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: service

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || { echo "go.mod/go.sum not tidy"; exit 1; }

      - name: Tests
        run: go test -count=1 ./...

      - name: Race
        run: go test -race -count=1 ./...

      - name: Dependency boundary (domain purity)
        run: go test -count=1 -run TestDomainDependencyBoundary ./internal/domain/

      - name: Release policy (dev mode tolerated)
        run: bash scripts/check-release.sh

      - name: Release policy (strict mode rejects replace)
        run: |
          if RELEASE_BUILD=1 bash scripts/check-release.sh; then
            echo "strict mode must reject the development replace"; exit 1
          fi

      - name: Smoke (binary boots, reaches Running, shuts down on signal)
        run: |
          go build -o /tmp/suromesh-service ./cmd/service
          SUROMESH_LISTEN_PLAINTEXT_DEV=true SUROMESH_LOG_FORMAT=text \
            timeout -s TERM 3 /tmp/suromesh-service && \
            { echo "service exited before timeout — unexpected"; exit 1; } || code=$?
          # timeout returns 124 when the service was still healthy at kill time
          [ "${code:-0}" = "124" ] || { echo "unexpected exit: $code"; exit 1; }

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Build (CGO disabled)
        working-directory: service
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath ./...
