# SuroMesh Service local deployment (dev/self-hosted).
#
# Fixed in Phase 27: the previous DSN used host-side `$(cat /run/secrets/…)`
# substitution — Compose interpolates environment references on the HOST at
# parse time and cannot read container-side secret files. The single source
# of truth for the database password is now the SUROMESH_PG_PASSWORD shell
# variable (or an uncommitted .env next to this file). Postgres was aligned
# to 17-alpine (the version the migration/integration qualification runs
# against).
#
# Usage (from service/deploy/compose/):
#   export SUROMESH_PG_PASSWORD="$(openssl rand -hex 16)"        # or .env
#   export SUROMESH_AUTH_BOOTSTRAP_KEY="sk_$(openssl rand -hex 24)"
#   head -c 32 /dev/urandom > .e2e-kek.bin                       # KEK (32 raw bytes)
#   docker compose -f ../docker-compose.yml --env-file .env up --build
#
# Secrets: never committed. The KEK file and the bootstrap key are yours;
# the same values must reach your secret manager in any real deployment.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: suromesh
      POSTGRES_USER: suromesh
      POSTGRES_PASSWORD: "${SUROMESH_PG_PASSWORD:?set SUROMESH_PG_PASSWORD (or use --env-file)}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suromesh -d suromesh"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  service:
    build:
      context: ../..
      dockerfile: service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUROMESH_LISTEN_ADDR: ":50051"
      SUROMESH_LISTEN_PLAINTEXT_DEV: "true"   # local compose only; TLS elsewhere
      SUROMESH_STORAGE_POSTGRES_DSN: "postgres://suromesh:${SUROMESH_PG_PASSWORD:?}@postgres:5432/suromesh?sslmode=disable"
      SUROMESH_CRYPTO_PROVIDER: "file"
      SUROMESH_CRYPTO_FILE_KEY: "/run/secrets/kek"
      SUROMESH_AUTH_BOOTSTRAP_KEY: "${SUROMESH_AUTH_BOOTSTRAP_KEY:?set SUROMESH_AUTH_BOOTSTRAP_KEY — never commit}"
      SUROMESH_AUTH_BOOTSTRAP_TENANT: "bootstrap"
      SUROMESH_LOG_LEVEL: "info"
    secrets: [kek]
    ports:
      - "50051:50051"
    restart: unless-stopped

secrets:
  kek:
    file: ./local-kek.bin

volumes:
  pg_data:
